[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dysthe-learning"
version = "0.0.1"
description = "Comparable learning methods consuming the same optical Dysthe fields and contracts."
requires-python = ">=3.10"
dependencies = ["dysthe-core @ git+https://github.com/matasvai/dysthe-core.git@45b2898231aa29e084a6b175d341807be52bd9a0"]

[tool.setuptools.packages.find]
where = ["src"]
