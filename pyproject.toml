[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dysthe-learning"
version = "0.0.2"
description = "Comparable learning methods consuming the same water-wave Dysthe fields and contracts."
requires-python = ">=3.10"
dependencies = ["dysthe-core @ git+https://github.com/matasvai/dysthe-core.git@10889fed1d20f02f8318d281322585284711eadd"]

[tool.setuptools.packages.find]
where = ["src"]
